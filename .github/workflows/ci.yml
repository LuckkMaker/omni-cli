name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q omni_cli tests
      - name: Unit tests
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests/test_*.py | ForEach-Object {
            Write-Host "== $($_.Name)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed test file(s) failed" }
      - name: CLI smoke
        run: |
          python -m omni_cli --version
          python -m omni_cli --help

  build-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file exe
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/omni.exe --title "OMNI CLI $tag" --notes "OMNI CLI $tag" --verify-tag
